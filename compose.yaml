services:
  uptime-bot:
    build: .
    restart: unless-stopped
    command: ["/app/uptime-bot", "/etc/jsol/config.yaml"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN}
      AGENT_TOKEN: ${AGENT_TOKEN:?задайте AGENT_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./configs/config.yaml:/etc/jsol/config.yaml:ro
      - uptime-data:/data
    ports:
      - "${AGENT_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uptime-data:
  redis-data:


