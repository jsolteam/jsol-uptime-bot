services:
  uptime-bot:
    image: ghcr.io/jsolteam/jsol-uptime-bot:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    command: ["/etc/jsol/config.yaml"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN}
      AGENT_TOKEN: ${AGENT_TOKEN:?задайте AGENT_TOKEN}
    volumes:
      - ./configs/config.yaml:/etc/jsol/config.yaml:ro
      - uptime-data:/data
    ports:
      - "${AGENT_BIND_ADDRESS:-0.0.0.0}:${AGENT_PUBLIC_PORT:-9595}:8080"
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  uptime-data:


