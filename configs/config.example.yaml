node:
  id: node-1
  priority: 1
telegram:
  token_env: TELEGRAM_BOT_TOKEN
  timezone: Europe/Moscow
  daily_report_time: "09:00"
storage:
  sqlite_path: /data/uptime.db
  backup_dir: /data/backups
  backup_interval: 24h
  backup_retention_days: 14
coordination:
  redis_url_env: REDIS_URL
  lease: 15s
  heartbeat: 5s
agent:
  listen: :8080
  token_env: AGENT_TOKEN
monitoring:
  interval: 30s
  timeout: 5s
  failure_threshold: 3
  recovery_threshold: 2
  agent_failure_threshold: 2m
  retention_days: 30
  internet_checks:
    - https://example.com
    - https://www.cloudflare.com/cdn-cgi/trace
servers:
  - id: node-1
    name: Основной сервер
    address: 192.168.1.10
    priority: 1
    agent_url: http://192.168.1.10:8080
admins:
  - 123456789

